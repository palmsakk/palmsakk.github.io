<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PalmSakk — Mostly anime, sometimes life.</title>
  <meta name="description" content="PalmSakk — Thai creator. Anime reactions, reviews and commentary, with a little everyday life. Find me on Instagram and TikTok.">
  <link rel="canonical" href="https://palmsakk.github.io/">
  <meta name="theme-color" content="#F8FAFD">
  <meta name="color-scheme" content="light">

  <!-- Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://palmsakk.github.io/">
  <meta property="og:title" content="PalmSakk — Mostly anime, sometimes life.">
  <meta property="og:description" content="A personal corner of the internet. Anime, thoughts, everyday life.">
  <meta property="og:image" content="https://palmsakk.github.io/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PalmSakk — Mostly anime, sometimes life.">
  <meta name="twitter:description" content="A personal corner of the internet. Anime, thoughts, everyday life.">
  <meta name="twitter:image" content="https://palmsakk.github.io/og-image.png">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Fonts (free, Google Fonts). Japanese is subset to only the 12 glyphs used. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&text=%E3%81%A4%E3%81%A5%E3%81%8F%E3%83%91%E3%83%BC%E3%83%A0%E3%82%B5%E3%83%83%E3%82%AF%E7%AC%AC%E4%B8%80%E8%A9%B1&display=swap">

  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page">

    <!-- 01 — Editorial header -->
    <header class="masthead reveal" style="--i:0">
      <p class="label">PS. / 001</p>
      <p class="label">A Personal Space</p>
    </header>

    <main>
      <!-- 02 — Hero -->
      <section class="hero" aria-labelledby="brand">
        <p class="chapter reveal" style="--i:1">
          <span class="label">Chapter 001</span>
          <span class="chapter__line" aria-hidden="true"></span>
          <span class="jp" lang="ja">第一話</span>
        </p>

        <div class="title reveal" style="--i:2">
          <h1 id="brand" class="brand" aria-label="PalmSakk">
            <span id="brand-l1" class="brand__l1">PALM</span>
            <span id="brand-l2" class="brand__l2">SAKK.</span>
          </h1>
          <span id="kana" class="kana" lang="ja" aria-hidden="true">パームサック</span>
        </div>

        <div id="lede" class="lede lede--photo reveal" style="--i:3">
          <figure id="portrait" class="portrait">
            <img id="portrait-img" src="assets/img/palm.jpg" alt="Palm sitting on a railing outside a convenience store in Japan" width="360" height="480" decoding="async">
            <figcaption id="portrait-cap" class="label label--muted">Fig. 01 — Palm</figcaption>
          </figure>
          <div class="lede__text">
            <span class="lede__rule" aria-hidden="true"></span>
            <p id="tagline" class="tagline">Mostly anime, sometimes life.</p>
            <p id="topics" class="label label--muted">Anime / Thoughts / Everyday life</p>
          </div>
        </div>
      </section>

      <!-- 03 — Links (rendered from assets/js/config.js) -->
      <section class="links" aria-labelledby="links-title">
        <div class="links__head reveal" style="--i:3">
          <h2 id="links-title" class="label">Find me elsewhere</h2>
          <span id="link-count" class="label label--muted">01 — 03</span>
        </div>
        <ol id="link-list" class="links__list"></ol>
        <p id="links-empty" class="links__empty label label--muted" hidden>Links coming soon.</p>
        <p id="copy-status" class="sr-only" role="status" aria-live="polite"></p>
        <noscript><p class="links__empty label label--muted">Please enable JavaScript to see the links.</p></noscript>
      </section>
    </main>

    <!-- 04 — Footer -->
    <footer class="foot reveal" style="--i:8">
      <div class="foot__left">
        <p id="foot-left" class="label">Thanks for visiting.</p>
        <p class="label label--muted">© <span id="year">2026</span> <span id="foot-name">PalmSakk</span></p>
      </div>
      <div class="foot__end">
        <span id="foot-jp" class="foot__jp" lang="ja">つづく</span>
        <p id="foot-en" class="label label--muted foot__en">To be continued</p>
      </div>
    </footer>

  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
